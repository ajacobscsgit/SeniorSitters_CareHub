<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SeniorSitters CareHub</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-logo">
            <h1>👴👵 SeniorSitters</h1>
            <p>CareHub Admin Portal</p>
        </div>
        
        <form class="login-form" id="loginForm">
            <div class="error-message" id="errorMessage"></div>
            
            <div class="form-group">
                <label for="email">Email Address</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    placeholder="admin@seniorsittersco.com"
                    required
                    autocomplete="email"
                >
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    placeholder="••••••"
                    required
                    autocomplete="current-password"
                >
            </div>
            
            <button type="submit" class="btn btn-primary" id="loginBtn">
                Sign In
            </button>
        </form>
        
        <p class="text-center mt-2" style="font-size: 0.85rem; color: var(--warm-muted);">
            Demo: admin@seniorsittersco.com / demo123
        </p>
    </div>

    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script>
        // Check if already logged in
        if (isAuthenticated()) {
            window.location.href = 'index.html';
        }

        // Handle login form
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMessage');
            const loginBtn = document.getElementById('loginBtn');
            
            // Clear previous errors
            errorMsg.textContent = '';
            errorMsg.classList.remove('show');
            
            // Show loading
            loginBtn.disabled = true;
            loginBtn.textContent = 'Signing in...';
            
            // Attempt login
            setTimeout(() => {
                const result = login(email, password);
                
                if (result.success) {
                    window.location.href = 'index.html';
                } else {
                    errorMsg.textContent = result.error;
                    errorMsg.classList.add('show');
                    loginBtn.disabled = false;
                    loginBtn.textContent = 'Sign In';
                }
            }, 500); // Small delay for UX
        });
    </script>
</body>
</html>
