<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SeniorSitters CareHub</title>
    <link rel="icon" href="data:,">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/design-system.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/premium.css">
    <!-- Phosphor Icons - Clean, professional icon system -->
    <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>
    <!-- Mobile Menu Toggle -->
    <button class="mobile-menu-toggle" id="mobileMenuToggle">
        <i class="ph ph-list"></i>
    </button>

    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-branding">
                <div class="sidebar-logo">
                    <i class="ph ph-heartbeat"></i>
                </div>
                <div class="sidebar-titles">
                    <h1 class="sidebar-company">SeniorSitters</h1>
                    <span class="sidebar-product">CareHub Portal</span>
                </div>
            </div>
            
            <nav class="sidebar-nav" id="sidebarNav">
                <button class="nav-item active" data-page="dashboard" data-roles="admin_owner,co_owner,caregiver,client_family">
                    <i class="ph ph-squares-four"></i>
                    <span>Dashboard</span>
                </button>
                <button class="nav-item" data-page="applications" data-roles="admin_owner,co_owner">
                    <i class="ph ph-user-plus"></i>
                    <span>Applications</span>
                </button>
                <button class="nav-item" data-page="care-requests" data-roles="admin_owner,co_owner">
                    <i class="ph ph-handshake"></i>
                    <span>Care Requests</span>
                </button>
                <button class="nav-item" data-page="caregivers" data-roles="admin_owner,co_owner">
                    <i class="ph ph-stethoscope"></i>
                    <span>Caregivers</span>
                </button>
                <button class="nav-item" data-page="clients" data-roles="admin_owner,co_owner,caregiver">
                    <i class="ph ph-users"></i>
                    <span>Clients</span>
                </button>
                <button class="nav-item" data-page="schedules" data-roles="admin_owner,co_owner,caregiver,client_family">
                    <i class="ph ph-calendar"></i>
                    <span>Schedules</span>
                </button>
                <button class="nav-item" data-page="timesheets" data-roles="admin_owner,co_owner,caregiver">
                    <i class="ph ph-clock"></i>
                    <span>Timesheets</span>
                </button>
                <button class="nav-item" data-page="visit-updates" data-roles="admin_owner,co_owner,caregiver,client_family">
                    <i class="ph ph-clipboard-text"></i>
                    <span>Visit Updates</span>
                </button>
                <button class="nav-item" data-page="training-hub" data-roles="admin_owner,co_owner,caregiver">
                    <i class="ph ph-graduation-cap"></i>
                    <span>Training Hub</span>
                </button>
                <button class="nav-item" data-page="notifications" data-roles="admin_owner,co_owner,caregiver,client_family">
                    <i class="ph ph-bell"></i>
                    <span>Notifications</span>
                </button>
                <button class="nav-item" data-page="settings" data-roles="admin_owner,co_owner,caregiver,client_family">
                    <i class="ph ph-gear"></i>
                    <span>Settings</span>
                </button>
            </nav>
            
            <div class="sidebar-footer">
                <div class="user-info">
                    <div class="user-avatar">
                        <i class="ph ph-user"></i>
                    </div>
                    <div class="user-details">
                        <div class="user-name" id="userName">Admin User</div>
                        <div class="user-role" id="userRole">Admin/Owner</div>
                    </div>
                    <!-- Notification bell (dropdown portal created by JS on document.body) -->
                    <button class="notif-bell-btn" id="notif-bell-btn" onclick="CareHubNotifications.toggleDropdown()" title="Notifications" aria-label="Notifications" style="margin-left:auto;flex-shrink:0;">
                        <i class="ph ph-bell"></i>
                        <span class="notif-badge" id="notif-badge" style="display:none;"></span>
                    </button>
                </div>
                <button class="logout-btn" id="logoutBtn">
                    <i class="ph ph-sign-out"></i>
                    <span>Logout</span>
                </button>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content" id="mainContent">
            <div class="loading-state" id="authLoading">
                <div class="spinner"></div>
                <p>Loading...</p>
            </div>
        </main>
    </div>

    <!-- Sidebar overlay (mobile) -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- Modal Container -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal" id="modal">
            <div class="modal-header">
                <h3 class="modal-title" id="modalTitle">Details</h3>
                <button class="modal-close" id="modalClose">&times;</button>
            </div>
            <div class="modal-body" id="modalBody">
                <!-- Modal content -->
            </div>
            <div class="modal-footer" id="modalFooter">
                <!-- Modal actions -->
            </div>
        </div>
    </div>

    <!-- Scripts - Note: Supabase CDN is in head -->
    <script src="js/config.js"></script>
    <script src="js/state.js"></script>
    <script src="js/supabase-auth.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/role-filter.js"></script>
    <script src="js/toast.js"></script>
    <script src="js/confirm-modal.js"></script>
    <script src="js/database.js"></script>
    <script src="js/refresh-coordinator.js"></script>
    <script src="js/realtime.js"></script>
    <script src="js/invite-user.js"></script>
    <script src="js/training-hub.js"></script>
    <script src="js/training-admin.js"></script>
    <script src="js/app.js"></script>
    <script>
        // Protect route - check auth immediately
        document.addEventListener('DOMContentLoaded', async function() {
            // Hydrate session from live Supabase token (no-op in DEV_MODE)
            if (typeof initAuth === 'function') await initAuth();
            if (!requireAuth()) {
                // Redirect handled in requireAuth
                return;
            }
            // Auth passed, app.js will initialize
        });
    </script>
</body>
</html>
